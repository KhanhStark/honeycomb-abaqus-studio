name: Licensed Explicit recovery acceptance
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Compare isolated native stop paths; does not qualify the campaign
        type: boolean
        default: false
      contact_ticket:
        description: Read simultaneous native forces from a retained completed ODB
        type: string
        default: ''
      source_sha:
        description: Pinned diagnostic code checkout on the authorized main workflow
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
      ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
      ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
      GITHUB_TOKEN: ${{ github.token }}
      HONEYCOMB_INSTALL_CAA: '1'
      HONEYCOMB_ACTIONS_LOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud
      - name: Reclaim disposable hosted runner SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/az /usr/lib/jvm /opt/hostedtoolcache/CodeQL; do
            if test -d "$directory" && ! test -L "$directory"; then sudo rm -rf --one-file-system -- "$directory"; fi
          done
          sudo apt-get clean
      - uses: ./.github/actions/abaqus-runtime
        with:
          tailscale_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          drive_credentials: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
      - name: Release verified installation media
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/abaqus-mount"
          media="$RUNNER_TEMP/abaqus-media-inspection/iso/DS.SIMULIA.Suite.2020.Linux64_Softgozar.com.iso"
          if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
          test -f "$media"
          rm -- "$media"
      - name: Audit simultaneous contact force and acceleration without FE
        if: inputs.contact_ticket != ''
        env:
          CONTACT_TICKET: ${{ inputs.contact_ticket }}
        run: uv run --locked --extra cloud python scripts/verify_force_sampling.py --ticket "$CONTACT_TICKET"
      - name: Prove checkpoint integrity and native recover before research retry
        if: ${{ !inputs.diagnostic && inputs.contact_ticket == '' }}
        run: uv run --locked --extra cloud python scripts/verify_explicit_recover.py
      - name: Compare native stop paths in the same Abaqus installation
        if: ${{ inputs.diagnostic && inputs.contact_ticket == '' }}
        run: uv run --locked --extra cloud python scripts/diagnose_explicit_stop.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: explicit-recover-verification
          path: |
            output/force-sampling-probe.json
            /tmp/honeycomb-force-probe/*.json
            /tmp/honeycomb-force-probe/*.log
            output/explicit-recover-verification.json
            /tmp/honeycomb-recover-probe/*.log
            /tmp/honeycomb-recover-probe/*.sta
            /tmp/honeycomb-recover-probe/*.json
            /tmp/honeycomb-recover-probe/*.txt
            output/install-probe/caa-installer.log
            output/actions-logs/**
            output/explicit-stop-diagnostic.json
            /tmp/honeycomb-stop-diagnostic/**/*.log
            /tmp/honeycomb-stop-diagnostic/**/*.sta
            /tmp/honeycomb-stop-diagnostic/**/*.cpp
            /tmp/honeycomb-stop-diagnostic/results.json
